    --bg: #14181d;

    font-family: "IBM Plex Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  a{ color: inherit; text-decoration: none; }

  .wrap{
    max-width: 1080px;
    margin: 0 auto;
    padding: 40px 24px 64px;
    position: relative;
    z-index: 1;
  }

  header{
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
    padding-bottom: 28px;
    margin-bottom: 32px;
    border-bottom: 1px solid var(--border);

    position: relative;
    margin: -40px -24px 32px;
    padding: 72px 24px 30px;
    background:
      linear-gradient(180deg, rgba(20,24,29,0.35) 0%, rgba(20,24,29,0.75) 60%, rgba(20,24,29,0.98) 100%),
      repeating-linear-gradient(95deg, rgba(0,0,0,0.22) 0px, rgba(0,0,0,0.22) 16px, transparent 16px, transparent 56px),
      radial-gradient(circle at 80% 0%, rgba(232,163,55,0.30), transparent 55%),
      linear-gradient(160deg, #2c323a 0%, #14181d 75%);
    border-bottom: none;
    overflow: hidden;
  }

  .brand-watermark{
    position: absolute;
    top: -60px;
    right: -40px;
    width: 260px;
    height: 260px;
    opacity: 0.09;
    transform: rotate(-8deg);
    pointer-events: none;
    z-index: 0;
  }

  .brand{
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
    z-index: 1;
  }

  .brand img{
    width: 84px;
    height: 84px;
    flex-shrink: 0;
  }

  .brand h1{
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }

  .brand p{
    margin: 0;
    color: var(--text-dim);
    font-size: 14px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }

  .clock{
    text-align: right;
    position: relative;
    z-index: 1;
  }

  .clock .time{
    font-family: "Space Grotesk", sans-serif;
    font-size: 26px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
  }

  .clock .date{
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 2px;
    text-transform: capitalize;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
  }

  .tile{
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 20px;
    background: rgba(28,34,42,0.55);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    backdrop-filter: blur(18px) saturate(150%);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius);
    overflow: hidden;
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.5s ease forwards;
    transition: border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
  }

  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
    .tile{ background: #1c222a; }
  }

  .tile::after{
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    border-style: solid;
    border-width: 0 22px 22px 0;
    border-color: transparent;
  }

  a.tile::after{ border-color: transparent var(--chip-color, var(--accent-dim)) transparent transparent; opacity: 0.55; }

  a.tile:hover,
  a.tile:focus-visible{
    border-color: var(--chip-color, var(--accent));
    transform: translateY(-2px);
  }

  a.tile:hover::after,
  a.tile:focus-visible::after{ opacity: 1; }

  a.tile:focus-visible{ outline: 2px solid var(--focus); outline-offset: 2px; }

  .tile.soon{
    background: var(--surface-soon);
    border: 1px dashed var(--border-soon);
    cursor: default;
  }

  .tile.soon::after{ border-color: transparent var(--border-soon) transparent transparent; }

  .tile.add{
    background: transparent;
    border: 1px dashed var(--border-soon);
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--text-faint);
    min-height: 148px;
  }

  .tile.add::after{ display: none; }

  .icon{
    width: 52px;
    height: 52px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--chip-bg, rgba(232,163,55,0.16));
    color: var(--chip-color, var(--accent));
  }

  .tile.add .icon{
    background: transparent;
    border: 1.5px dashed var(--border-soon);
    color: var(--text-faint);
  }

  .icon svg{ width: 52%; height: 52%; }
  .icon img{ width: 60%; height: 60%; object-fit: contain; }

  /* Tarjetas con foto de portada, estilo poster */
  .tile.hasCover{
    padding: 0;
    gap: 0;
    background: #0f1317;
    min-height: 240px;
    justify-content: flex-end;
  }

  .cover{
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 0;
  }

  .cover img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
    transition: transform 0.4s ease;
  }

  a.tile.hasCover:hover .cover img{ transform: scale(1.05); }

  .cover::after{
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(transparent 25%, rgba(10,13,16,0.75) 62%, rgba(10,13,16,0.96) 100%);
  }

  .tile.hasCover .body{
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 20px;
  }

  .tile.hasCover h2{ color: #ffffff; }
  .tile.hasCover p{ color: rgba(255,255,255,0.82); }

  .tile.hasCover .tag{
    color: rgba(255,255,255,0.9);
    border-color: rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.08);
  }

  .tile h2{
    font-family: "Space Grotesk", sans-serif;
    font-size: 18px;
    font-weight: 600;
    margin: 0;
  }

  .tile p{
    font-size: 13.5px;
    line-height: 1.45;
    color: var(--text-dim);
    margin: 0;
  }

  .tag{
    align-self: flex-start;
    font-size: 12px;
    color: var(--text-faint);
    border: 1px solid var(--border-soon);
    padding: 3px 9px;
    border-radius: 100px;
    margin-top: auto;
  }

  footer{
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    color: var(--text-faint);
    font-size: 13px;
    position: relative;
    z-index: 1;
  }

  @keyframes rise{
    to{ opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .tile{ animation: none; opacity: 1; transform: none; }
    a.tile:hover, a.tile:focus-visible{ transform: none; }
  }

  @media (max-width: 480px){
    header{ flex-direction: column; align-items: flex-start; }
    .clock{ text-align: left; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>

  };

  const categoryColors = {
    "Turnos": "#e8a337",
    "Carga": "#3aa0e0",
    "Gestión": "#a06bea",
    "Incidencias": "#e2574c",
    "Seguridad": "#3ec98a",
  };

  const grid = document.getElementById("grid");

  apps.forEach((app, i) => {
    const isActive = app.status === "active" && app.url;
    const el = document.createElement(isActive ? "a" : "div");
    if (isActive){
      el.href = app.url;
      el.target = "_blank";
      el.rel = "noopener";
    }
    el.className = "tile" + (isActive ? "" : " soon") + (app.cover ? " hasCover" : "");
    el.style.animationDelay = (i * 60) + "ms";
    const color = categoryColors[app.tag] || "#e8a337";
    if (!el.classList.contains("add")){
      el.style.setProperty("--chip-bg", color + "29");
      el.style.setProperty("--chip-color", color);
    }
    if (app.cover){
      el.innerHTML = `
        <div class="cover">
          <img src="${covers[app.cover]}" alt="">
        </div>
        <div class="body">
          <h2>${app.name}</h2>
          <p>${app.desc}</p>
          <span class="tag">${isActive ? app.tag : "Próximamente"}</span>
        </div>
      `;
    } else {
      el.innerHTML = `
        <div class="icon">${icons[app.icon] || ""}</div>
        <h2>${app.name}</h2>
        <p>${app.desc}</p>
        <span class="tag">${isActive ? app.tag : "Próximamente"}</span>
      `;
    }
    grid.appendChild(el);
  });

  const addTile = document.createElement("div");
  addTile.className = "tile add";
  addTile.style.animationDelay = (apps.length * 60) + "ms";
  addTile.innerHTML = `
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
    <p style="margin-top:4px;">Aquí aparecerá la próxima app</p>
  `;
  grid.appendChild(addTile);

  // La marca de agua reutiliza el mismo logo ya embebido (no duplica la imagen)
  const brandLogo = document.querySelector(".brand img");
  const watermark = document.getElementById("watermark");
  if (brandLogo && watermark) watermark.src = brandLogo.src;

  function tick(){
    const now = new Date();
    document.getElementById("time").textContent =
      now.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
    document.getElementById("date").textContent =
      now.toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" });
  }
  tick();
  setInterval(tick, 30000);
</script>
